name: Dinheirizz CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Code Quality, Standards & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent Standards Review
        run: pnpm standards:review

      - name: Build Application & PWA
        run: pnpm build

      - name: Run Test Suite (Vitest)
        run: pnpm test
