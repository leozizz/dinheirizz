name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke Test CLI
        run: node bin/agent-standards.mjs --help
      - name: Test Auto-Discovery
        run: node bin/agent-standards.mjs discover
